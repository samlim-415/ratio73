name: Storefront preview checks
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/preview-check.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify storefront and capture review images
        run: |
          npm run dev > /tmp/ratio73-server.log 2>&1 &
          node scripts/verify-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ratio73-preview-review
          path: docs/preview/
      - name: Save verified review images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/preview/
          git diff --cached --quiet || git commit -m 'docs: update verified storefront preview images [skip ci]'
          git push
